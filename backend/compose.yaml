services:
  postgres:
    image: 'postgres:17'
    environment:
      - 'POSTGRES_DB=lendledger'
      - 'POSTGRES_PASSWORD=susaN9'
      - 'POSTGRES_USER=lendledger_app'
    ports: ["5432:5432"]

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U lendledger_app -d lendledger" ]
      interval: 5s
      timeout: 3s
      retries: 10

